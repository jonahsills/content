<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Moonshine Sapat workflow in Daytona</title>
  <desc id="desc">A four step workflow from Daytona workspace to local Moonshine transcription output.</desc>
  <rect width="1120" height="560" fill="#f8fafc"/>
  <rect x="56" y="72" width="1008" height="416" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="92" y="124" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">Run Sapat with Moonshine Voice in a Daytona workspace</text>
  <text x="92" y="162" fill="#4b5563" font-family="Arial, sans-serif" font-size="18">On-device transcription keeps audio local while Daytona keeps the environment repeatable.</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="228" width="190" height="126" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="134" cy="264" r="18" fill="#0284c7"/>
    <text x="128" y="271" fill="#ffffff" font-size="20" font-weight="700">1</text>
    <text x="118" y="306" fill="#0f172a" font-size="20" font-weight="700">Workspace</text>
    <text x="118" y="334" fill="#334155" font-size="16">Create Daytona workspace</text>

    <path d="M300 291H388" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M388 291L370 279M388 291L370 303" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

    <rect x="404" y="228" width="190" height="126" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="442" cy="264" r="18" fill="#16a34a"/>
    <text x="436" y="271" fill="#ffffff" font-size="20" font-weight="700">2</text>
    <text x="426" y="306" fill="#0f172a" font-size="20" font-weight="700">Install</text>
    <text x="426" y="334" fill="#334155" font-size="16">pip install sapat[moonshine]</text>

    <path d="M608 291H696" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M696 291L678 279M696 291L678 303" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

    <rect x="712" y="228" width="190" height="126" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="750" cy="264" r="18" fill="#d97706"/>
    <text x="744" y="271" fill="#ffffff" font-size="20" font-weight="700">3</text>
    <text x="734" y="306" fill="#0f172a" font-size="20" font-weight="700">Transcribe</text>
    <text x="734" y="334" fill="#334155" font-size="16">sapat sample.wav --api moonshine</text>

    <path d="M916 291H988" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M988 291L970 279M988 291L970 303" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

    <rect x="936" y="378" width="88" height="54" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="955" y="412" fill="#312e81" font-size="18" font-weight="700">TXT</text>
  </g>
</svg>
